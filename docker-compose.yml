version: "3.8"

services:
  api:
    build: .
    container_name: biomed-kg-memory-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - GRAPH_BACKEND=neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=biomed-memory
      - EXTRACTION_MODE=rule
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - hf_cache:/app/data/hf_cache

  neo4j:
    image: neo4j:5-community
    container_name: biomed-kg-memory-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/biomed-memory
      - NEO4J_PLUGINS=[]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
  hf_cache:
